<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TrackIE</title>
    <meta name="description" content="Live bus tracking and departures for your stop, powered by bustimes.org.">
    <meta name="theme-color" content="#f6f7f9">
    <script>
      // The status bar matches the page background (--bg in style.css) in light
      // and dark mode. One tag, updated here, because installed apps often ignore
      // theme-color tags that rely on a media query.
      (function () {
        var meta = document.querySelector('meta[name="theme-color"]');
        var dark = window.matchMedia('(prefers-color-scheme: dark)');
        function update() {
          meta.setAttribute('content', dark.matches ? '#101418' : '#f6f7f9');
        }
        update();
        if (dark.addEventListener) dark.addEventListener('change', update);
        else if (dark.addListener) dark.addListener(update);
      })();
    </script>
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TrackIE">
    <meta name="format-detection" content="telephone=no">
